<div data-th-fragment="contact">
  <!-- Main modal -->
  <div
    id="view_contact_modal"
    tabindex="-1"
    aria-hidden="true"
    class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full"
  >
    <div class="relative p-4 w-full max-w-xl max-h-full">
      <!-- Modal content -->
      <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
        <!-- Modal header -->
        <div
          class="flex flex-col items-center justify-center p-4 md:p-5 border-b rounded-t dark:border-gray-600 relative"
        >
          <button
            type="button"
            class="absolute top-2 right-2 text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
            onclick="closeContactModal()"
          >
            <svg
              class="w-3 h-3"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 14 14"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
              />
            </svg>
            <span class="sr-only">Close modal</span>
          </button>
          <img onerror="this.src='https://static-00.iconduck.com/assets.00/profile-default-icon-2048x2045-u3j7s5nj.png'" id="contact_profile_picture" class="w-20 h-20 rounded-full mb-2" src="" alt="Profile Picture">
          <div class="text-center">
            <h3
              id="contact_name"
              class="text-lg font-semibold text-gray-900 dark:text-white"
            ></h3>
            <span class="text-gray-800 dark:text-gray-300 text-sm" id="contact_email"></span>
            <div id="contact_phone" class="text-gray-800 dark:text-gray-300 text-sm"></div>
          </div>
        </div>
        <!-- Modal body -->
        <div class="p-4 md:p-5 space-y-3">
          <div class="border-b border-gray-200 dark:border-gray-600"></div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-400">Description</label>
            <div id="description" class="text-sm leading-relaxed text-gray-500 dark:text-gray-400">
              Description content goes here.
            </div>
          </div>
          <div class="border-b border-gray-200 dark:border-gray-600"></div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-400">Address</label>
            <div id="contact_address" class="text-sm leading-relaxed text-gray-500 dark:text-gray-400">
              Address content goes here.
            </div>
          </div>
          <div class="border-b border-gray-200 dark:border-gray-600"></div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-400">Favorite</label>
            <div id="favorite" class="text-sm leading-relaxed text-gray-500 dark:text-gray-400">
              Favorite content goes here.
            </div>
          </div>
          <div class="border-b border-gray-200 dark:border-gray-600"></div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-400">LinkedIn</label>
            <div id="linkedin" class="text-sm leading-relaxed text-gray-500 dark:text-gray-400">
              LinkedIn link goes here.
            </div>
          </div>
          <div class="border-b border-gray-200 dark:border-gray-600"></div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-400">Website</label>
            <div id="website" class="text-sm leading-relaxed text-gray-500 dark:text-gray-400">
              Website link goes here.
            </div>
          </div>
        </div>
        <!-- Modal footer -->
        <div class="flex justify-center p-4 md:p-5 border-t border-gray-200 rounded-b dark:border-gray-600">
          <button
            onclick="closeContactModal()"
            type="button"
            class="py-2.5 px-5 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700"
          >
            Close
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
